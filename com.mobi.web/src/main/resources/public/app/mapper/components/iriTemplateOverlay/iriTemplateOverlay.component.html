<h1 mat-dialog-title>Edit IRI Template</h1>
<div mat-dialog-content>
  <p class="help-text">
    Enter the IRI template. Type <code>&#36;&#123;</code> to insert column values or UUID.
  </p>

  <app-trigger-mention-input
    [formControl]="templateControl"
    [triggerConfig]="triggerConfig"
    [suggestions]="columnSuggestions"
    [patternValidator]="validatePattern"
    [resolveValidator]="validateResolvedIri"
    [required]="true"
    label="IRI Template"
    [placeholder]="'https://example.com/class/\${Column}'"
    hint="Whitespace in values will be removed. Duplicate values create single individuals.">
  </app-trigger-mention-input>

  <div class="example-iri mt-2" *ngIf="exampleIri">
    <strong>Example: </strong><span class="example-value">{{ exampleIri }}</span>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-raised-button [mat-dialog-close]="">Cancel</button>
  <button mat-raised-button color="primary" (click)="set()" [disabled]="!isValid">Submit</button>
</div>
