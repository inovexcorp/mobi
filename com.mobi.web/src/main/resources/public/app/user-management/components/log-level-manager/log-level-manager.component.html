<div class="log-level-manager">
  <div class="table-header-section d-flex justify-content-between align-items-baseline">
    <!-- Filter -->
    <div>
      <search-bar class="flex-1 remove-min-width" [(bindModel)]="filterValue" (submitEvent)="applyFilter()"></search-bar>
    </div>
    <!-- Actions -->
    <div>
      <button mat-raised-button class="add-logger-button" (click)="openAddModal()" color="primary">Add Logger</button>
      <button mat-icon-button class="refresh-button ml-1" (click)="loadLoggers()"><mat-icon>refresh</mat-icon></button>
      <button mat-icon-button class="info-button ml-1" (click)="openHelpModal()"><mat-icon>info</mat-icon></button>
    </div>
  </div>

  <!-- Loggers Table -->
  <div class="table-container" #tableContainer>
    <table mat-table [dataSource]="dataSource" class="loggers-table">

      <!-- Logger Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Logger Name</th>
        <td mat-cell *matCellDef="let row" class="logger-name-cell">
          <div class="logger-name-wrapper">
            <mat-icon *ngIf="row.isRoot" class="root-icon">home</mat-icon>
            <span [class.root-logger]="row.isRoot">{{ row.name }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Log Level Column -->
      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef>Log Level</th>
        <td mat-cell *matCellDef="let row">
          <app-log-level-select [availableLevels]="availableLevels" [(ngModel)]="row.level" (ngModelChange)="updateLoggerLevel(row.name, $event)"></app-log-level-select>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button 
                  class="delete-logger-button"
                  color="warn"
                  (click)="confirmDeleteLogger(row.name)"
                  [disabled]="row.isRoot"
                  [matTooltip]="row.isRoot ? 'Cannot delete ROOT logger' : 'Delete logger'">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- No Data State -->
    <div *ngIf="!loading && dataSource.data.length === 0" class="no-data">
      <mat-icon>inbox</mat-icon>
      <p>No loggers configured</p>
    </div>
  </div>
</div>
